# After a production deploy, submit scripts/indexnow-release.txt to IndexNow, but only if that file changed in
# the deployed commit. Ordinary deploys submit nothing: no mass resubmits.
name: IndexNow
on: deployment_status
jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs --quiet
      - run: node scripts/indexnow.mjs --if-release-changed
